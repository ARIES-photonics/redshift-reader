name: smoke test

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse Python files
        run: python -m py_compile redshift_reader.py redshift_engine_v2.py app.py
      - name: Load command line interface
        run: python redshift_reader.py --help
